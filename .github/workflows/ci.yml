name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Demo smoke — five embedded fault scenarios detected
        run: python scripts/smoke.py

      - name: Real dataset smoke — contract + output coherence
        run: python scripts/smoke_real.py