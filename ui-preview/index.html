<!DOCTYPE html>
<html lang="en" style="color-scheme: dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThermaSight — Intelligent Energy &amp; Equipment Monitoring</title>
    <meta
      name="description"
      content="Intelligent energy and equipment monitoring: unsupervised ML learns each chiller's normal behaviour and turns meaningful deviations into evidence and action."
    />
    <link rel="icon" href="./assets/favicon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body class="ts-page-bg">
    <a class="ts-skip" href="#view">Skip to content</a>
    <div class="ts-app">
      <header class="ts-header">
        <div class="ts-header-inner">
          <button class="ts-header-brand" id="btn-brand" aria-label="ThermaSight home">
            <span class="ts-brand">
              <svg viewBox="0 0 24 24" class="ts-brand-mark" aria-hidden="true">
                <path
                  d="M12 2.4 L20.6 7.2 V16.8 L12 21.6 L3.4 16.8 V7.2 Z"
                  fill="none"
                  stroke="var(--ts-accent)"
                  stroke-width="1.6"
                  stroke-linejoin="round"
                />
                <path
                  d="M12 6.8 c -3.1 3.6 -4.6 6.1 -4.6 8.1 a 4.6 4.6 0 0 0 9.2 0 c 0 -2 -1.5 -4.5 -4.6 -8.1 Z"
                  fill="var(--ts-accent)"
                  opacity="0.85"
                />
              </svg>
              <span class="ts-brand-name">ThermaSight</span>
              <span class="ts-brand-sub">chiller intelligence · console</span>
            </span>
          </button>
          <nav class="ts-tabs" aria-label="Sections">
            <button class="ts-tab ts-tab-active" data-tab="overview">Overview</button>
            <button class="ts-tab" data-tab="explorer">Explorer</button>
            <button class="ts-tab" data-tab="anomalies">Anomalies<span class="ts-tab-count" id="tab-anomaly-count" hidden></span></button>
            <button class="ts-tab" data-tab="methodology">Method</button>
            <button class="ts-tab" data-tab="data">Data</button>
          </nav>
          <div class="ts-header-status" id="header-status"></div>
        </div>
      </header>

      <main id="view" tabindex="-1"></main>

      <footer class="ts-footer">
        <span>ThermaSight</span>
        <span class="ts-footer-mid">built for YUKTHI 2026 · intelligent energy and equipment monitoring</span>
        <span class="mono ts-footer-mut">python backend · vanilla html · css · js</span>
      </footer>
    </div>

    <!-- episode investigation drawer -->
    <div class="ts-drawer-layer" id="drawer-layer" hidden>
      <button class="ts-drawer-backdrop" id="drawer-close" aria-label="Close investigation"></button>
      <aside class="ts-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1">
        <div class="ts-drawer-head">
          <div class="flex items-center gap-2" id="drawer-head"></div>
          <button class="ts-icon-btn" id="drawer-close-x" aria-label="Close investigation"><span aria-hidden="true">✕</span></button>
        </div>
        <div class="ts-drawer-scroll" id="drawer-body"></div>
      </aside>
    </div>

    <!-- analysis progress overlay -->
    <div class="ts-progress-layer" id="progress-layer" hidden role="status" aria-live="polite">
      <div class="ts-progress-card">
        <p class="ts-progress-stage mono" id="progress-stage">Analysing</p>
        <ol class="ts-progress-log mono" id="progress-log" aria-label="Pipeline stages"></ol>
        <div class="ts-progress-track" aria-hidden="true"><div class="ts-progress-fill" id="progress-fill" style="width: 4%"></div></div>
        <p class="ts-progress-pct mono" id="progress-pct">t+0s</p>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
